<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản — SkillRental Platform</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }
    .auth-header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
      color: var(--text-heading);
    }
    .auth-logo i {
      color: var(--primary);
    }
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      width: 100%;
      max-width: 480px;
      padding: 36px 32px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }
    .auth-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-heading);
      margin-bottom: 6px;
      text-align: center;
    }
    .auth-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 24px;
    }
    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .role-box {
      border: 2px solid var(--border-color);
      border-radius: var(--radius-input);
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .role-box:hover {
      border-color: var(--primary);
    }
    .role-box.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .role-box i {
      font-size: 20px;
      color: var(--primary);
      margin-bottom: 6px;
      display: block;
    }
    .role-title {
      font-weight: 700;
      font-size: 13px;
      color: var(--text-heading);
    }
    .role-desc {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-heading);
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .form-control {
      width: 100%;
      height: 44px;
      padding: 10px 14px 10px 40px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-input);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      background: #FFFFFF;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
    }
    .btn-auth-submit {
      width: 100%;
      height: 46px;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-btn);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-auth-submit:hover {
      background: var(--primary-dark);
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .auth-footer a {
      font-weight: 700;
      color: var(--primary);
    }
    .alert-banner {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .alert-error {
      background: #FEE2E2;
      color: #DC2626;
      border: 1px solid #FCA5A5;
    }
    .alert-success {
      background: #DCFCE7;
      color: #15803D;
      border: 1px solid #86EFAC;
    }
  </style>
</head>
<body>

  <header class="auth-header">
    <a href="index.html" class="auth-logo">
      <i class="fa-solid fa-briefcase"></i> SkillRental
    </a>
    <a href="index.html" style="color: var(--text-secondary); font-weight: 500; font-size: 14px;">
      <i class="fa-solid fa-house"></i> Trang chủ
    </a>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Đăng Ký Tài Khoản</h1>
      <p class="auth-subtitle">Bắt đầu trải nghiệm nền tảng thuê kỹ năng hàng đầu</p>

      <div id="alert-box" class="alert-banner"></div>

      <!-- Lựa chọn Vai trò -->
      <label class="form-label" style="margin-bottom: 8px;">Bạn là ai trên hệ thống?</label>
      <div class="role-selector">
        <div class="role-box active" id="role-customer" onclick="selectRole('CUSTOMER')">
          <i class="fa-solid fa-user"></i>
          <div class="role-title">Khách hàng</div>
          <div class="role-desc">Cần tìm và thuê người làm</div>
        </div>
        <div class="role-box" id="role-provider" onclick="selectRole('PROVIDER')">
          <i class="fa-solid fa-user-gear"></i>
          <div class="role-title">Người cung cấp</div>
          <div class="role-desc">Đăng bài & cho thuê kỹ năng</div>
        </div>
      </div>

      <form id="register-form">
        <input type="hidden" id="selected-role" value="CUSTOMER">

        <div class="form-group">
          <label class="form-label" for="reg-fullname">Họ và Tên</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="reg-fullname" class="form-control" placeholder="Nguyễn Văn An" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Địa chỉ Email</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-phone">Số điện thoại</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-phone"></i>
            <input type="tel" id="reg-phone" class="form-control" placeholder="0901 234 567">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Mật khẩu</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="reg-password" class="form-control" placeholder="Ít nhất 6 ký tự" required minlength="6">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Nhập lại Mật khẩu</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-shield-halved"></i>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Nhập lại chính xác mật khẩu" required>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" required style="margin-top: 3px;">
            <span>Tôi đồng ý với <a href="#" style="color: var(--primary); font-weight: 600;">Điều khoản dịch vụ</a> & <a href="#" style="color: var(--primary); font-weight: 600;">Chính sách bảo mật</a> của SkillRental.</span>
          </label>
        </div>

        <button type="submit" id="submit-btn" class="btn-auth-submit">
          <span>Tạo Tài Khoản</span>
          <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>

      <div class="auth-footer">
        Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
      </div>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const alertBox = document.getElementById('alert-box');

    function selectRole(role) {
      document.getElementById('selected-role').value = role;
      document.getElementById('role-customer').classList.toggle('active', role === 'CUSTOMER');
      document.getElementById('role-provider').classList.toggle('active', role === 'PROVIDER');
    }

    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className = `alert-banner alert-${type}`;
      alertBox.style.display = 'block';
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('reg-fullname').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;
      const role = document.getElementById('selected-role').value;

      if (password !== confirmPassword) {
        showAlert('Mật khẩu nhập lại không trùng khớp.', 'error');
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';
      alertBox.style.display = 'none';

      try {
        const res = await registerUser({
          fullName,
          email,
          phone,
          password,
          role
        });

        if (res.success) {
          showAlert('Đăng ký thành công! Vui lòng kiểm tra email để kích hoạt tài khoản.', 'success');
          showToast('Đăng ký thành công', 'Email xác nhận đã được gửi đi!', 'success');
          if (res.verifyUrl) {
            console.log('[Dev Verification Link]:', res.verifyUrl);
          }
          setTimeout(() => {
            window.location.href = 'login.html?registered=1';
          }, 2500);
        }
      } catch (err) {
        showAlert(err.message, 'error');
        showToast('Lỗi đăng ký', err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Tạo Tài Khoản</span> <i class="fa-solid fa-user-plus"></i>';
      }
    });
  </script>
</body>
</html>
