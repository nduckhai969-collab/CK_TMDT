<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillRental - Tin Nhắn Trực Tiếp Với Chuyên Gia (Customer Chat)</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Design System CSS -->
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #F8FAFC; color: #1E293B; font-family: 'Inter', sans-serif; }
    .chat-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 120px);
      max-width: 1240px;
      margin: 20px auto 40px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    .chat-sidebar {
      border-right: 1px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      background: #FAFAFA;
    }
    .conversation-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      border-bottom: 1px solid #F1F5F9;
      transition: background 0.15s ease;
    }
    .conversation-item:hover, .conversation-item.active {
      background: #F0FDF4;
    }
    .chat-main {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid #E2E8F0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
    }
    .messages-area {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #F8FAFC;
    }
    .msg-bubble {
      max-width: 65%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      position: relative;
    }
    .msg-bubble.mine {
      align-self: flex-end;
      background: #16A34A;
      color: #FFFFFF;
      border-bottom-right-radius: 4px;
    }
    .msg-bubble.theirs {
      align-self: flex-start;
      background: #FFFFFF;
      color: #0F172A;
      border: 1px solid #E2E8F0;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .msg-time {
      font-size: 10.5px;
      margin-top: 4px;
      opacity: 0.8;
      text-align: right;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <div id="navbar-placeholder"></div>

  <div class="chat-layout">

    <!-- LEFT SIDEBAR: CONVERSATIONS LIST -->
    <div class="chat-sidebar">
      <div style="padding:16px 18px; border-bottom:1px solid #E2E8F0; background:#FFF;">
        <h3 style="font-size:16px; font-weight:800; color:#0F172A; margin:0 0 10px;">Hội Thoại Chuyên Gia</h3>
        <div style="position:relative;">
          <i class="fa-solid fa-search" style="position:absolute; left:12px; top:11px; color:#94A3B8; font-size:13px;"></i>
          <input type="text" placeholder="Tìm theo tên..." style="width:100%; padding:8px 12px 8px 34px; border:1px solid #CBD5E1; border-radius:8px; font-size:13px; font-family:inherit; outline:none;">
        </div>
      </div>

      <div id="conversationsList" style="flex:1; overflow-y:auto;">
        <!-- Loaded via JS -->
      </div>
    </div>

    <!-- RIGHT: CHAT WINDOW -->
    <div class="chat-main">
      
      <!-- Chat Header -->
      <div class="chat-header">
        <div style="display:flex; align-items:center; gap:12px;">
          <div style="position:relative;">
            <img id="chatPartnerAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Avatar" style="width:44px; height:44px; border-radius:12px; object-fit:cover; border:2px solid #E2E8F0;">
            <div style="position:absolute; bottom:-2px; right:-2px; width:12px; height:12px; border-radius:50%; background:#22C55E; border:2px solid #FFF;"></div>
          </div>
          <div>
            <div style="font-weight:800; font-size:15px; color:#0F172A;" id="chatPartnerName">Nguyễn Văn An</div>
            <div style="font-size:12px; color:#16A34A; font-weight:600;"><i class="fa-solid fa-circle" style="font-size:8px;"></i> Đang hoạt động • Phản hồi tức thì</div>
          </div>
        </div>

        <div style="display:flex; gap:10px;">
          <a id="btnViewProfile" href="customer_provider.html?id=PRV001" class="btn btn-outline btn-sm" style="font-weight:600;">
            <i class="fa-solid fa-user"></i> Xem Hồ Sơ
          </a>
          <a id="btnBookFromChat" href="customer_provider.html?id=PRV001" class="btn btn-primary btn-sm" style="font-weight:700;">
            <i class="fa-solid fa-calendar-check"></i> Đặt Lịch & Ký Quỹ
          </a>
        </div>
      </div>

      <!-- Messages Area -->
      <div class="messages-area" id="messagesContainer">
        <!-- Messages loaded dynamically -->
      </div>

      <!-- Input Message Bar -->
      <div style="padding:16px 24px; border-top:1px solid #E2E8F0; background:#FFFFFF; display:flex; align-items:center; gap:12px;">
        <button title="Gửi tài liệu/ảnh" onclick="showToast('Đính Kèm', 'Bạn có thể chọn file dự án hoặc thiết kế để gửi cho chuyên gia', 'info')" style="background:transparent; border:none; color:#64748B; font-size:18px; cursor:pointer; padding:6px;">
          <i class="fa-solid fa-paperclip"></i>
        </button>
        <input type="text" id="chatInput" placeholder="Nhập tin nhắn trao đổi yêu cầu với chuyên gia..." style="flex:1; padding:11px 16px; border:1px solid #CBD5E1; border-radius:10px; font-size:13.5px; font-family:inherit; outline:none;" onkeyup="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" class="btn btn-primary" style="padding:11px 22px; font-weight:700; border-radius:10px;">
          <i class="fa-solid fa-paper-plane"></i> Gửi
        </button>
      </div>

    </div>

  </div>

  <div id="footer-placeholder"></div>

  <script src="customer.js"></script>
  <script>
    let currentPartner = {
      id: 'USR001',
      providerId: 'PRV001',
      name: 'Nguyễn Văn An',
      specialty: 'Senior Fullstack Web Dev',
      avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'
    };

    const contacts = [
      { id: 'USR001', providerId: 'PRV001', name: 'Nguyễn Văn An', specialty: 'Senior Fullstack Web Dev', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100', lastMsg: 'Vâng, em đã nhận đơn và bắt đầu code ạ.' },
      { id: 'USR002', providerId: 'PRV002', name: 'Trần Thị Lan', specialty: 'Senior UI/UX Designer', avatar: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100', lastMsg: 'Chị đã xem file brief yêu cầu logo rồi nhé.' },
      { id: 'USR005', providerId: 'PRV003', name: 'Phạm Hữu Cường', specialty: 'Gia Sư IELTS 8.5', avatar: 'https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=100', lastMsg: 'Lịch học tối mai lúc 19:30 qua Zoom nhé em.' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('navbar-placeholder').innerHTML = renderCustomerNavbar('chat');
      document.getElementById('footer-placeholder').innerHTML = renderCustomerFooter();

      // Check partner from URL query
      const urlParams = new URLSearchParams(window.location.search);
      const withId = urlParams.get('with');
      if (withId) {
        const found = contacts.find(c => c.providerId === withId || c.id === withId);
        if (found) currentPartner = found;
      }

      renderConversationsList();
      selectPartner(currentPartner);
    });

    function renderConversationsList() {
      const container = document.getElementById('conversationsList');
      container.innerHTML = contacts.map(c => `
        <div class="conversation-item ${c.id === currentPartner.id ? 'active' : ''}" onclick="selectPartnerById('${c.id}')">
          <div style="position:relative;">
            <img src="${c.avatar}" alt="${c.name}" style="width:42px; height:42px; border-radius:10px; object-fit:cover; border:1px solid #E2E8F0;">
            <div style="position:absolute; bottom:-1px; right:-1px; width:10px; height:10px; border-radius:50%; background:#22C55E; border:1.5px solid #FFF;"></div>
          </div>
          <div style="flex:1; min-width:0;">
            <div style="font-weight:700; font-size:13.5px; color:#0F172A; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${c.name}</div>
            <div style="font-size:11.5px; color:#64748B; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${c.lastMsg}</div>
          </div>
        </div>
      `).join('');
    }

    function selectPartnerById(id) {
      const p = contacts.find(c => c.id === id);
      if (p) selectPartner(p);
    }

    function selectPartner(partner) {
      currentPartner = partner;
      document.getElementById('chatPartnerName').textContent = partner.name;
      document.getElementById('chatPartnerAvatar').src = partner.avatar;
      document.getElementById('btnViewProfile').href = `customer_provider.html?id=${partner.providerId}`;
      document.getElementById('btnBookFromChat').href = `customer_provider.html?id=${partner.providerId}`;

      renderConversationsList();
      loadMessages();
    }

    async function loadMessages() {
      const user = getCurrentCustomer();
      const res = await apiRequest(`/api/chat?user1=${user.id}&user2=${currentPartner.id}`);
      const container = document.getElementById('messagesContainer');

      let msgs = [];
      if (res.success && res.messages && res.messages.length > 0) {
        msgs = res.messages;
      } else {
        // Sample default greeting message
        msgs = [
          { fromUserId: currentPartner.id, text: `Chào ${user.name}! Tôi là ${currentPartner.name}. Tôi có thể hỗ trợ gì cho dự án của bạn?`, time: 'Hôm nay' }
        ];
      }

      container.innerHTML = msgs.map(m => {
        const isMine = m.fromUserId === user.id;
        return `
          <div class="msg-bubble ${isMine ? 'mine' : 'theirs'}">
            <div>${m.text}</div>
            <div class="msg-time">${m.time || ''}</div>
          </div>
        `;
      }).join('');

      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const user = getCurrentCustomer();
      input.value = '';

      // Append immediately
      const container = document.getElementById('messagesContainer');
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      container.innerHTML += `
        <div class="msg-bubble mine">
          <div>${text}</div>
          <div class="msg-time">${timeStr}</div>
        </div>
      `;
      container.scrollTop = container.scrollHeight;

      // Call API
      await apiRequest('/api/chat', {
        method: 'POST',
        body: JSON.stringify({
          fromUserId: user.id,
          toUserId: currentPartner.id,
          text: text
        })
      });

      // Auto reply simulation after 1.5s
      setTimeout(() => {
        const replyText = `Cảm ơn bạn! Mình đã nắm được thông tin. Bạn có thể bấm nút "Đặt Lịch & Ký Quỹ" ở góc trên để sàn kích hoạt bảo lãnh Escrow an toàn nhé!`;
        container.innerHTML += `
          <div class="msg-bubble theirs">
            <div>${replyText}</div>
            <div class="msg-time">${timeStr}</div>
          </div>
        `;
        container.scrollTop = container.scrollHeight;
      }, 1500);
    }
  </script>
</body>
</html>
