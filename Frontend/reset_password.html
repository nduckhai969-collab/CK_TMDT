<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt Lại Mật Khẩu - SkillRental</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #16A34A;
      --primary-dark: #15803D;
      --bg-page: #F8FAFC;
      --card-bg: #FFFFFF;
      --border-color: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #64748B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .reset-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    .icon-box {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #DCFCE7;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px;
    }
    .icon-box.error { background: #FEE2E2; color: #EF4444; }
    .icon-box.reset { background: #EDE9FE; color: #7C3AED; }
    h1 { font-size: 22px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
    p { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper i.prefix-icon {
      position: absolute;
      left: 14px;
      color: #94A3B8;
      font-size: 14px;
    }
    .input-wrapper input {
      width: 100%;
      height: 44px;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      padding: 0 42px 0 38px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      outline: none;
      transition: all .2s;
    }
    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
    }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
    }
    .toggle-pwd:hover { color: var(--text-main); }
    .btn-submit {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #16A34A 0%, #15803D 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35);
      transition: all .2s;
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(22, 163, 74, 0.45);
    }
    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }
    .note-box {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      color: #64748B;
      text-align: left;
      margin-top: 18px;
      line-height: 1.5;
    }
    .note-box i { color: #D97706; margin-right: 4px; }
    .alert-msg {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: left;
    }
    .alert-error { background: #FEF2F2; border: 1px solid #FECACA; color: #DC2626; }
    .alert-success { background: #F0FDF4; border: 1px solid #BBF7D0; color: #16A34A; }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="reset-card" id="mainCard">
    <div class="icon-box reset" id="iconBox"><i class="fa-solid fa-key"></i></div>
    <h1 id="titleText">Đặt Lại Mật Khẩu</h1>
    <p id="subText">Đang xác thực liên kết của bạn...</p>

    <div id="alertBox" class="alert-msg"></div>

    <form id="resetForm" style="display: none;" onsubmit="handleResetSubmit(event)">
      <div class="form-group">
        <label for="newPassword">Mật khẩu mới (tối thiểu 8 ký tự)</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock prefix-icon"></i>
          <input type="password" id="newPassword" placeholder="Nhập mật khẩu mới" minlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-pwd" onclick="togglePassword('newPassword', this)"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Nhập lại mật khẩu mới</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-shield-halved prefix-icon"></i>
          <input type="password" id="confirmPassword" placeholder="Xác nhận mật khẩu mới" minlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-pwd" onclick="togglePassword('confirmPassword', this)"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <i class="fa-solid fa-check"></i> Lưu Mật Khẩu Mới
      </button>

      <div class="note-box">
        <i class="fa-solid fa-shield-halved"></i> <strong>Lưu ý bảo mật:</strong> Sau khi đổi mật khẩu, toàn bộ các phiên làm việc (Session) trên các thiết bị khác sẽ tự động bị hủy để bảo vệ tài khoản của bạn.
      </div>
    </form>

    <div id="errorActions" style="display: none; margin-top: 20px;">
      <a href="index.html?auth=login" class="btn-submit" style="text-decoration: none;">
        <i class="fa-solid fa-arrow-left"></i> Quay Lại Đăng Nhập
      </a>
    </div>

    <a href="index.html" class="back-link"><i class="fa-solid fa-house"></i> Về Trang Chủ SkillRental</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      btn.innerHTML = isPwd ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
    }

    function showAlert(msg, isError = true) {
      const box = document.getElementById('alertBox');
      if (!box) return;
      box.className = 'alert-msg ' + (isError ? 'alert-error' : 'alert-success');
      box.textContent = msg;
      box.style.display = 'block';
    }

    // 1. Kiểm tra Token khi tải trang
    document.addEventListener('DOMContentLoaded', async () => {
      const titleText = document.getElementById('titleText');
      const subText = document.getElementById('subText');
      const iconBox = document.getElementById('iconBox');
      const resetForm = document.getElementById('resetForm');
      const errorActions = document.getElementById('errorActions');

      if (!token) {
        iconBox.className = 'icon-box error';
        iconBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
        titleText.textContent = 'Liên Kết Không Hợp Lệ';
        subText.textContent = 'Mã xác thực token bị thiếu. Vui lòng kiểm tra lại liên kết trong email.';
        errorActions.style.display = 'block';
        return;
      }

      try {
        const res = await fetch(`/api/auth/verify-reset-token?token=${encodeURIComponent(token)}`).then(r => r.json());
        if (!res.success) {
          iconBox.className = 'icon-box error';
          iconBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
          titleText.textContent = 'Liên Kết Hết Hạn';
          subText.textContent = res.message || 'Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn (chỉ có hiệu lực trong 30 phút).';
          errorActions.style.display = 'block';
          return;
        }

        // Token hợp lệ -> Hiển thị form nhập mật khẩu mới
        titleText.textContent = 'Tạo Mật Khẩu Mới';
        subText.innerHTML = `Xin chào <strong>${res.name || 'bạn'}</strong> (${res.email}), vui lòng nhập mật khẩu mới bên dưới.`;
        resetForm.style.display = 'block';
      } catch (err) {
        iconBox.className = 'icon-box error';
        iconBox.innerHTML = '<i class="fa-solid fa-wifi"></i>';
        titleText.textContent = 'Lỗi Kết Nối';
        subText.textContent = 'Không thể kết nối với máy chủ. Vui lòng kiểm tra xem server backend đã chạy chưa.';
        errorActions.style.display = 'block';
      }
    });

    // 2. Submit đặt lại mật khẩu mới
    async function handleResetSubmit(e) {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btnSubmit = document.getElementById('btnSubmit');

      if (newPassword.length < 8) {
        showAlert('Mật khẩu mới phải có ít nhất 8 ký tự!', true);
        return;
      }
      if (newPassword !== confirmPassword) {
        showAlert('Mật khẩu xác nhận không khớp!', true);
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang cập nhật...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ token, newPassword })
        }).then(r => r.json());

        if (res.success) {
          // Xóa session client cũ
          localStorage.removeItem('SKILLRENTAL_CURRENT_USER');
          localStorage.removeItem('SKILLRENTAL_CUSTOMER_USER');
          localStorage.removeItem('SKILLRENTAL_PROVIDER_USER');
          ['SKILLRENTAL_ACCESS_TOKEN', 'SKILLRENTAL_CURRENT_USER', 'SKILLRENTAL_CUSTOMER_USER', 'SKILLRENTAL_PROVIDER_USER'].forEach(key => { sessionStorage.removeItem(key); localStorage.removeItem(key); });

          const iconBox = document.getElementById('iconBox');
          iconBox.className = 'icon-box';
          iconBox.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
          document.getElementById('titleText').textContent = 'Thành Công!';
          document.getElementById('subText').textContent = res.message || 'Mật khẩu đã được thay đổi. Toàn bộ phiên đăng nhập cũ trên các thiết bị đã bị hủy.';
          document.getElementById('resetForm').style.display = 'none';

          document.getElementById('errorActions').innerHTML = `
            <a href="index.html?auth=login" class="btn-submit" style="text-decoration:none;">
              <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập Với Mật Khẩu Mới
            </a>
          `;
          document.getElementById('errorActions').style.display = 'block';
        } else {
          showAlert(res.message || 'Không thể đặt lại mật khẩu.', true);
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<i class="fa-solid fa-check"></i> Lưu Mật Khẩu Mới';
        }
      } catch (err) {
        showAlert('Lỗi kết nối tới máy chủ.', true);
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="fa-solid fa-check"></i> Lưu Mật Khẩu Mới';
      }
    }
  </script>
</body>
</html>
