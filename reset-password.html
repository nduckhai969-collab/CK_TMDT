<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt Lai Mật Khẩu — SkillRental Platform</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: var(--bg-page);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }
    .auth-header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
      color: var(--text-heading);
    }
    .auth-logo i {
      color: var(--primary);
    }
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }
    .auth-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-heading);
      margin-bottom: 6px;
      text-align: center;
    }
    .auth-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-heading);
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .form-control {
      width: 100%;
      height: 44px;
      padding: 10px 14px 10px 40px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-input);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      background: #FFFFFF;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
    }
    .btn-auth-submit {
      width: 100%;
      height: 46px;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-btn);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-auth-submit:hover {
      background: var(--primary-dark);
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .auth-footer a {
      font-weight: 700;
      color: var(--primary);
    }
    .alert-banner {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .alert-error {
      background: #FEE2E2;
      color: #DC2626;
      border: 1px solid #FCA5A5;
    }
    .alert-success {
      background: #DCFCE7;
      color: #15803D;
      border: 1px solid #86EFAC;
    }
  </style>
</head>
<body>

  <header class="auth-header">
    <a href="index.html" class="auth-logo">
      <i class="fa-solid fa-briefcase"></i> SkillRental
    </a>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Tạo Mật Khẩu Mới</h1>
      <p class="auth-subtitle">Vui lòng nhập mật khẩu mới cho tài khoản của bạn</p>

      <div id="alert-box" class="alert-banner"></div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="new-password">Mật khẩu mới</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="new-password" class="form-control" placeholder="Ít nhất 6 ký tự" required minlength="6">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-new-password">Nhập lại mật khẩu mới</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-shield-halved"></i>
            <input type="password" id="confirm-new-password" class="form-control" placeholder="Xác nhận mật khẩu mới" required>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-auth-submit">
          <span>Lưu Mật Khẩu Mới</span>
          <i class="fa-solid fa-key"></i>
        </button>
      </form>

      <div class="auth-footer">
        Quay lại <a href="login.html">Đăng nhập</a>
      </div>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const alertBox = document.getElementById('alert-box');
    const urlParams = new URLSearchParams(window.location.search);
    const resetToken = urlParams.get('token');

    if (!resetToken) {
      showAlert('Thiếu mã token xác thực khôi phục mật khẩu. Vui lòng kiểm tra lại link email.', 'error');
      document.getElementById('submit-btn').disabled = true;
    }

    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className = `alert-banner alert-${type}`;
      alertBox.style.display = 'block';
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = document.getElementById('new-password').value;
      const confirmNewPassword = document.getElementById('confirm-new-password').value;

      if (newPassword !== confirmNewPassword) {
        showAlert('Mật khẩu nhập lại không khớp.', 'error');
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu...';
      alertBox.style.display = 'none';

      try {
        const res = await resetPasswordSubmit(resetToken, newPassword);
        if (res.success) {
          showAlert(res.message, 'success');
          showToast('Đã đổi mật khẩu', 'Vui lòng đăng nhập bằng mật khẩu mới!', 'success');
          setTimeout(() => {
            window.location.href = 'login.html?pwd_reset=1';
          }, 2000);
        }
      } catch (err) {
        showAlert(err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Lưu Mật Khẩu Mới</span> <i class="fa-solid fa-key"></i>';
      }
    });
  </script>
</body>
</html>
