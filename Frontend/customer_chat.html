<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillRental - Tin Nhắn Trực Tiếp Với Chuyên Gia (Customer Chat)</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Design System CSS -->
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #F8FAFC; color: #1E293B; font-family: 'Inter', sans-serif; }
    .chat-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 120px);
      max-width: 1240px;
      margin: 20px auto 40px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    .chat-sidebar {
      border-right: 1px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      background: #FAFAFA;
    }
    .conversation-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      border-bottom: 1px solid #F1F5F9;
      transition: background 0.15s ease;
    }
    .conversation-item:hover, .conversation-item.active {
      background: #F0FDF4;
    }
    .chat-main {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid #E2E8F0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
    }
    .messages-area {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #F8FAFC;
    }
    .msg-bubble {
      max-width: 65%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      position: relative;
    }
    .msg-bubble.mine {
      align-self: flex-end;
      background: #16A34A;
      color: #FFFFFF;
      border-bottom-right-radius: 4px;
    }
    .msg-bubble.theirs {
      align-self: flex-start;
      background: #FFFFFF;
      color: #0F172A;
      border: 1px solid #E2E8F0;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .msg-time {
      font-size: 10.5px;
      margin-top: 4px;
      opacity: 0.8;
      text-align: right;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-client.js"></script>
</head>
<body>

  <!-- Top Navbar -->
  <div id="navbar-placeholder"></div>

  <div class="chat-layout">

    <!-- LEFT SIDEBAR: CONVERSATIONS LIST -->
    <div class="chat-sidebar">
      <div style="padding:16px 18px; border-bottom:1px solid #E2E8F0; background:#FFF;">
        <h3 style="font-size:16px; font-weight:800; color:#0F172A; margin:0 0 10px;">Hội Thoại Chuyên Gia</h3>
        <div style="position:relative;">
          <i class="fa-solid fa-search" style="position:absolute; left:12px; top:11px; color:#94A3B8; font-size:13px;"></i>
          <input type="text" placeholder="Tìm theo tên..." style="width:100%; padding:8px 12px 8px 34px; border:1px solid #CBD5E1; border-radius:8px; font-size:13px; font-family:inherit; outline:none;">
        </div>
      </div>

      <div id="conversationsList" style="flex:1; overflow-y:auto;">
        <!-- Loaded via JS -->
      </div>
    </div>

    <!-- RIGHT: CHAT WINDOW -->
    <div class="chat-main">
      
      <!-- Chat Header -->
      <div class="chat-header">
        <div style="display:flex; align-items:center; gap:12px;">
          <div style="position:relative;">
            <img id="chatPartnerAvatar" src="" alt="" style="display:none;width:44px;height:44px;border-radius:12px;object-fit:cover;border:2px solid #E2E8F0;">
          </div>
          <div>
            <div style="font-weight:800; font-size:15px; color:#0F172A;" id="chatPartnerName">Chọn cuộc trò chuyện</div>
            <div id="chatPartnerStatus" style="font-size:12px; color:#64748B; font-weight:600;">Hội thoại</div>
          </div>
        </div>

        <div style="display:flex; gap:10px;">
          <a id="btnViewProfile" href="#" class="btn btn-outline btn-sm" style="display:none;font-weight:600;">
            <i class="fa-solid fa-user"></i> Xem Hồ Sơ
          </a>
          <a id="btnBookFromChat" href="#" class="btn btn-primary btn-sm" style="display:none;font-weight:700;">
            <i class="fa-solid fa-calendar-check"></i> Đặt Lịch & Ký Quỹ
          </a>
        </div>
      </div>

      <!-- Messages Area -->
      <div class="messages-area" id="messagesContainer">
        <!-- Messages loaded dynamically -->
      </div>

      <!-- Input Message Bar -->
      <div style="padding:16px 24px; border-top:1px solid #E2E8F0; background:#FFFFFF; display:flex; align-items:center; gap:12px;">
        <button title="Gửi tài liệu/ảnh" onclick="showToast('Đính Kèm', 'Bạn có thể chọn file dự án hoặc thiết kế để gửi cho chuyên gia', 'info')" style="background:transparent; border:none; color:#64748B; font-size:18px; cursor:pointer; padding:6px;">
          <i class="fa-solid fa-paperclip"></i>
        </button>
        <input type="text" id="chatInput" placeholder="Nhập tin nhắn trao đổi yêu cầu với chuyên gia..." style="flex:1; padding:11px 16px; border:1px solid #CBD5E1; border-radius:10px; font-size:13.5px; font-family:inherit; outline:none;" onkeyup="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" class="btn btn-primary" style="padding:11px 22px; font-weight:700; border-radius:10px;">
          <i class="fa-solid fa-paper-plane"></i> Gửi
        </button>
      </div>

    </div>

  </div>

  <div id="footer-placeholder"></div>

  <script src="customer.js"></script>
  <script>
    let currentPartner = null;
    const contacts = [];

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('navbar-placeholder').innerHTML = renderCustomerNavbar('chat');
      document.getElementById('footer-placeholder').innerHTML = renderCustomerFooter();

      const user = getCurrentCustomer();
      if (!user || user.role !== 'Customer') {
        renderConversationsList();
        document.getElementById('messagesContainer').innerHTML = '<div style="margin:auto;padding:28px;text-align:center;color:#64748B"><i class="fa-solid fa-lock" style="font-size:28px;color:#16A34A"></i><p style="font-weight:700;color:#0F172A">Đăng nhập để sử dụng chat</p><p>Đăng nhập tài khoản khách hàng để xem hội thoại và nhắn tin với Provider.</p><button class="btn btn-primary" onclick="openAuthModal(\'login\')">Đăng nhập</button></div>';
        document.getElementById('chatPartnerName').textContent = 'Chưa đăng nhập';
        document.getElementById('btnViewProfile').style.display = 'none';
        document.getElementById('btnBookFromChat').style.display = 'none';
        document.getElementById('chatInput').disabled = true;
        document.getElementById('chatInput').placeholder = 'Đăng nhập để nhắn tin';
        document.querySelector('.chat-main > div:last-child').style.display = 'none';
        return;
      }

      await loadChatThreads();
      // Resolve a requested Provider or select the newest real conversation.
      const urlParams = new URLSearchParams(window.location.search);
      const withId = urlParams.get('with');
      if (withId) {
        let found = contacts.find(c => c.providerId === withId || c.id === withId);
        if (!found) {
          const providerResult = await apiRequest(`/api/providers/${encodeURIComponent(withId)}`);
          const provider = providerResult.provider;
          if (provider) {
            found = {
              id: provider.userId || provider.id,
              providerId: provider.id,
              name: provider.name,
              specialty: provider.specialty || 'Chuyên gia',
              avatar: provider.avatar || '',
              lastMsg: 'Chưa có tin nhắn'
            };
            contacts.push(found);
          }
        }
        if (found) currentPartner = found;
      } else if (contacts.length) {
        currentPartner = contacts[0];
      }

      renderConversationsList();
      if (currentPartner) selectPartner(currentPartner);
      else {
        document.getElementById('chatPartnerName').textContent = 'Chưa có cuộc trò chuyện';
        document.getElementById('messagesContainer').innerHTML = '<div style="margin:auto;padding:28px;text-align:center;color:#64748B">Mở hồ sơ Provider và nhấn Nhắn tin để bắt đầu cuộc trò chuyện.</div>';
        document.getElementById('chatInput').disabled = true;
        document.getElementById('chatInput').placeholder = 'Chọn Provider để bắt đầu nhắn tin';
        document.querySelector('.chat-main > div:last-child').style.display = 'none';
      }

      // Khởi động chu kỳ Polling tự động làm mới cho khách hàng
      setInterval(loadMessagesSilently, 2500);
      setInterval(async () => {
        await loadChatThreads();
        renderConversationsList();
      }, 5000);
    });

    async function loadChatThreads() {
      const result = await apiRequest('/api/chat/threads');
      if (!result.success || !Array.isArray(result.threads)) return;
      contacts.splice(0, contacts.length, ...result.threads.map(thread => ({
        id: thread.partnerId,
        providerId: thread.providerId,
        name: thread.name || 'Tài khoản',
        specialty: thread.role || '',
        avatar: thread.avatar || '',
        lastMsg: thread.lastMessage || ''
      })));
    }

    function renderConversationsList() {
      const container = document.getElementById('conversationsList');
      const user = getCurrentCustomer();
      if (!user || user.role !== 'Customer') {
        container.innerHTML = '<div style="padding:22px 18px;text-align:center;color:#64748B"><i class="fa-solid fa-lock" style="font-size:22px;color:#16A34A"></i><p>Đăng nhập để xem các cuộc trò chuyện.</p><button class="btn btn-primary btn-sm" onclick="openAuthModal(\'login\')">Đăng nhập</button></div>';
        return;
      }
      if (!contacts.length) {
        container.innerHTML = '<div style="padding:22px 18px;text-align:center;color:#64748B">Chưa có cuộc trò chuyện.</div>';
        return;
      }
      container.innerHTML = contacts.map(c => `
        <div class="conversation-item ${currentPartner && c.id === currentPartner.id ? 'active' : ''}" onclick="selectPartnerById('${c.id}')">
          <div style="position:relative;">
            <img src="${c.avatar || ''}" alt="${c.name}" onerror="this.style.display='none'" style="width:42px;height:42px;border-radius:10px;object-fit:cover;border:1px solid #E2E8F0;${c.avatar ? '' : 'display:none;'}">
            <div style="position:absolute; bottom:-1px; right:-1px; width:10px; height:10px; border-radius:50%; background:#22C55E; border:1.5px solid #FFF;"></div>
          </div>
          <div style="flex:1; min-width:0;">
            <div style="font-weight:700; font-size:13.5px; color:#0F172A; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${c.name}</div>
            <div style="font-size:11.5px; color:#64748B; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${c.lastMsg}</div>
          </div>
        </div>
      `).join('');
    }

    function selectPartnerById(id) {
      if (!requireCustomerLogin()) return;
      const p = contacts.find(c => c.id === id);
      if (p) selectPartner(p);
    }

    function selectPartner(partner) {
      if (!requireCustomerLogin()) return;
      if (!partner) return;
      currentPartner = partner;
      document.getElementById('chatPartnerName').textContent = partner.name;
      document.getElementById('chatPartnerStatus').textContent = partner.specialty || 'Hội thoại';
      const avatar = document.getElementById('chatPartnerAvatar');
      avatar.src = partner.avatar || '';
      avatar.style.display = partner.avatar ? 'block' : 'none';
      document.getElementById('btnViewProfile').href = `customer_provider.html?id=${partner.providerId}`;
      document.getElementById('btnBookFromChat').href = `customer_provider.html?id=${partner.providerId}`;
      document.getElementById('btnViewProfile').style.display = '';
      document.getElementById('btnBookFromChat').style.display = '';
      document.getElementById('chatInput').disabled = false;
      document.getElementById('chatInput').placeholder = 'Nhập tin nhắn trao đổi yêu cầu với chuyên gia...';
      document.querySelector('.chat-main > div:last-child').style.display = '';

      renderConversationsList();
      loadMessages();
    }

    let lastCustomerMsgCount = -1;

    function renderCustomerMessages(msgs, user) {
      const container = document.getElementById('messagesContainer');
      container.replaceChildren();
      if (!msgs.length) {
        const empty = document.createElement('div');
        empty.style.cssText = 'margin:auto;text-align:center;color:#94A3B8;font-size:13px';
        empty.textContent = 'Chưa có tin nhắn. Hãy bắt đầu cuộc trò chuyện!';
        container.appendChild(empty);
      }
      msgs.forEach(message => {
        const bubble = document.createElement('div');
        const isMine = message.fromUserId === user.id;
        bubble.className = `msg-bubble ${isMine ? 'mine' : 'theirs'}`;

        if (message.isAutoReply) {
          const autoBadge = document.createElement('div');
          autoBadge.style.cssText = 'display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;background:#e0f2fe;color:#0369a1;padding:2px 6px;border-radius:4px;margin-bottom:4px;';
          autoBadge.innerHTML = '<i class="fa-solid fa-robot"></i> Phản hồi tự động';
          bubble.appendChild(autoBadge);
        }

        const body = document.createElement('div');
        body.textContent = message.text || '';
        const time = document.createElement('div');
        time.className = 'msg-time';
        time.textContent = message.time || '';
        bubble.append(body, time);
        container.appendChild(bubble);
      });

      container.scrollTop = container.scrollHeight;
      lastCustomerMsgCount = msgs.length;
    }

    async function loadMessages() {
      if (!currentPartner) return;
      const user = getCurrentCustomer();
      if (!user || user.role !== 'Customer') {
        document.getElementById('messagesContainer').innerHTML = '<div style="padding:28px;text-align:center;color:#64748B"><i class="fa-solid fa-lock" style="font-size:28px"></i><p>Đăng nhập bằng tài khoản khách hàng để xem cuộc trò chuyện.</p><button class="btn btn-primary" onclick="openAuthModal(\'login\')">Đăng nhập</button></div>';
        return;
      }
      const res = await apiRequest(`/api/chat?user1=${user.id}&user2=${currentPartner.id}`);
      const msgs = res.success && Array.isArray(res.messages) ? res.messages : [];
      renderCustomerMessages(msgs, user);
    }

    async function loadMessagesSilently() {
      if (!currentPartner) return;
      const user = getCurrentCustomer();
      if (!user || user.role !== 'Customer') return;
      try {
        const res = await apiRequest(`/api/chat?user1=${user.id}&user2=${currentPartner.id}`);
        const msgs = res.success && Array.isArray(res.messages) ? res.messages : [];
        if (msgs.length !== lastCustomerMsgCount) {
          renderCustomerMessages(msgs, user);
        }
      } catch (e) {}
    }

    async function sendMessage() {
      if (!requireCustomerLogin()) return;
      if (!currentPartner) return;
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const user = getCurrentCustomer();
      input.value = '';

      const result = await apiRequest('/api/chat', {
        method: 'POST',
        body: JSON.stringify({
          fromUserId: user.id,
          toUserId: currentPartner.id,
          text: text
        })
      });

      if (!result.success) {
        showToast('Chưa gửi được', result.message || 'Vui lòng thử lại.', 'error');
        input.value = text;
        return;
      }

      await loadMessages();
      await loadChatThreads();
      renderConversationsList();
    }
  </script>
</body>
</html>
