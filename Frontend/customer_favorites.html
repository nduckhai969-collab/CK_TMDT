<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillRental - Provider yêu thích</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="style.css">
  <style>
    body{background:#f8faf9;color:#172033;font-family:Inter,sans-serif}.favorites-wrap{max-width:1120px;margin:28px auto 60px;padding:0 22px}.favorites-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:27px 30px;border:1px solid #f4cbd4;border-radius:18px;background:linear-gradient(120deg,#fff1f2,#fff 70%);margin-bottom:21px}.favorites-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:15px}.favorite-card{background:#fff;border:1px solid #e1e8e4;border-radius:15px;padding:17px;box-shadow:0 3px 12px #0f172a08;transition:.18s}.favorite-card:hover{border-color:#fda4af;box-shadow:0 9px 22px #0f172a10;transform:translateY(-2px)}.favorite-card-head{display:flex;align-items:flex-start;gap:12px}.favorite-avatar{width:56px;height:56px;border-radius:14px;object-fit:cover;background:#f1f5f9}.favorite-name{font-size:15px;font-weight:800;color:#172033;margin:1px 0 4px}.favorite-heart{width:34px;height:34px;margin-left:auto;border:1px solid #fecdd3;border-radius:10px;background:#fff1f2;color:#e11d48;cursor:pointer}.favorite-tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.favorite-tag{font-size:10px;font-weight:700;color:#475569;background:#f1f5f9;border-radius:999px;padding:5px 8px}.favorite-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid #edf1ef;padding-top:13px}.favorite-actions .btn{justify-content:center;font-size:12px}.favorites-empty{padding:45px 22px;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:16px;color:#64748b}.favorites-empty i{width:56px;height:56px;display:grid;place-items:center;margin:0 auto 13px;border-radius:17px;background:#fff1f2;color:#e11d48;font-size:22px}.favorites-empty .btn-primary i{width:auto;height:auto;display:inline-block;margin:0;border-radius:0;background:transparent;color:inherit;font-size:inherit}
    @media(max-width:640px){.favorites-hero{padding:21px;align-items:flex-start;flex-direction:column}.favorites-grid{grid-template-columns:1fr}}
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-client.js"></script>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main class="favorites-wrap">
    <section class="favorites-hero"><div><div style="display:inline-flex;align-items:center;gap:7px;padding:5px 10px;background:#ffe4e6;color:#be123c;border-radius:999px;font-size:11px;font-weight:800;margin-bottom:9px"><i class="fa-solid fa-heart"></i> ĐÃ LƯU</div><h1 style="font-size:clamp(24px,4vw,31px);margin:0">Provider yêu thích</h1><p style="font-size:13px;color:#64748b;line-height:1.6;margin:7px 0 0">Lưu những chuyên gia bạn muốn xem lại hoặc đặt lịch sau.</p></div><a href="find_provider.html" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> Khám phá Provider</a></section>
    <div id="favoritesList"><div class="favorites-empty"><i class="fa-solid fa-circle-notch fa-spin"></i><div>Đang tải danh sách yêu thích...</div></div></div>
  </main>
  <div id="footer-placeholder"></div>
  <script src="customer.js"></script>
  <script>
    let allFavoriteProviders = [];
    const escapeFavorite = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('navbar-placeholder').innerHTML = renderCustomerNavbar('providers');
      document.getElementById('footer-placeholder').innerHTML = renderCustomerFooter();
      loadFavoritesPage();
    });
    async function loadFavoritesPage() {
      const user = getCurrentCustomer();
      if (!user || user.role !== 'Customer') {
        document.getElementById('favoritesList').innerHTML = '<div class="favorites-empty"><i class="fa-solid fa-lock"></i><h3>Đăng nhập để xem Provider yêu thích</h3><p>Danh sách yêu thích được lưu theo tài khoản khách hàng của bạn.</p><button class="btn btn-primary" onclick="openAuthModal(\'login\')">Đăng nhập</button></div>';
        return;
      }
      const result = await apiRequest('/api/providers/favorites');
      if (!result.success) { document.getElementById('favoritesList').innerHTML = '<div class="favorites-empty" style="color:#b91c1c">Không tải được danh sách yêu thích. Vui lòng thử lại.</div>'; return; }
      allFavoriteProviders = result.providers || [];
      favoriteProviderIds = new Set(result.providerIds || []);
      favoriteProviderIdsLoaded = true;
      renderFavoriteProviders();
    }
    function renderFavoriteProviders() {
      const container = document.getElementById('favoritesList');
      if (!container) return;
      const providers = allFavoriteProviders.filter(provider => favoriteProviderIds.has(provider.id));
      if (!providers.length) {
        container.innerHTML = '<div class="favorites-empty"><i class="fa-solid fa-heart-crack"></i><h3>Chưa có Provider yêu thích</h3><p>Nhấn biểu tượng trái tim trên hồ sơ hoặc thẻ Provider để lưu vào đây.</p><a class="btn btn-primary" href="find_provider.html"><i class="fa-solid fa-magnifying-glass"></i> Tìm Provider</a></div>';
        return;
      }
      container.innerHTML = `<div style="font-size:12px;color:#64748b;margin:0 0 12px">${providers.length} Provider đã lưu</div><div class="favorites-grid">${providers.map(provider => `<article class="favorite-card"><div class="favorite-card-head"><img class="favorite-avatar" src="${escapeFavorite(provider.avatar || '')}" alt=""><div style="min-width:0"><h2 class="favorite-name">${escapeFavorite(provider.name || 'Provider')}</h2><div style="font-size:11px;color:#64748b;line-height:1.5">${escapeFavorite(provider.specialty || 'Chuyên gia')}</div></div><button type="button" class="favorite-heart" data-favorite-provider="${escapeFavorite(provider.id)}" aria-label="Bỏ yêu thích" title="Bỏ yêu thích" onclick="toggleFavoriteProvider('${escapeFavorite(provider.id)}',this)"><i class="fa-solid fa-heart"></i></button></div><div class="favorite-tags"><span class="favorite-tag"><i class="fa-solid fa-star" style="color:#e9a814"></i> ${escapeFavorite(provider.rating || '—')} · ${escapeFavorite(provider.reviewCount || 0)} đánh giá</span><span class="favorite-tag"><i class="fa-solid fa-location-dot"></i> ${escapeFavorite(provider.location || 'Chưa cập nhật')}</span></div><div class="favorite-actions"><a class="btn btn-outline" href="customer_provider.html?id=${encodeURIComponent(provider.id)}"><i class="fa-regular fa-id-badge"></i> Xem hồ sơ</a><a class="btn btn-primary" href="customer_booking.html?id=${encodeURIComponent(provider.id)}"><i class="fa-solid fa-calendar-check"></i> Đặt lịch</a></div></article>`).join('')}</div>`;
    }
  </script>
</body>
</html>
